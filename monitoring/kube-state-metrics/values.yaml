# monitoring/kube-state-metrics/values.yaml
#
# Standalone `prometheus-community/kube-state-metrics` Helm release, deployed
# by deploy_monitoring.sh's deploy_kube_state_metrics(). The bundled subchart
# inside kube-prometheus-stack is disabled (see
# monitoring/prometheus/values.yaml.tpl) to avoid a duplicate instance.
#
# No ${} placeholders — this file is passed to Helm as-is (no envsubst step),
# same convention as monitoring/node-exporter/values.yaml.
#
# Works in both environments: ArgoCD and direct
# Supports: Minikube · Kind · K3s · K8s · EKS · GKE · AKS · MicroK8s

prometheus:
  monitor:
    enabled: true          # creates a ServiceMonitor picked up automatically
                            # (serviceMonitorSelector.matchLabels: {} in prometheus/values.yaml.tpl)

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Tolerate control-plane taints so metrics are still gathered on
# single-node clusters (Minikube, Kind, K3s) where the control-plane node
# also runs workloads.
tolerations:
  - operator: Exists