apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-app-config
  namespace: devops-app
  labels:
    app: devops-app
data:
  APP_NAME: "devops-app"
  APP_PORT: "3000"
  APP_ENV: "production"
  LOG_LEVEL: "info"
  # In-cluster Service name, NOT "localhost" — the DB runs in a different pod,
  # so the app must reach it via a Kubernetes Service DNS name (or an
  # external endpoint if you're using a managed DB). This must match the
  # fallback default in deploy_kubernetes.sh's patch_overlay().
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "devops_db"
  MODEL_NAME: "baseline-v1"
  MODEL_PATH: "/app/models/artifacts/model.pkl"