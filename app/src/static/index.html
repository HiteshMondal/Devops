<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevOps Ops Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
>
<link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">&gt;_</span>
      <div>
        <h1>DevOps Ops Board</h1>
        <p class="subtitle">ops board — track work as it moves through the pipeline</p>
      </div>
    </div>
    <div class="ticker" id="ticker" aria-live="polite">
      <div class="ticker-item"><span class="dot dot-backlog"></span>backlog <b id="stat-backlog">0</b></div>
      <div class="ticker-item"><span class="dot dot-progress"></span>in progress <b id="stat-progress">0</b></div>
      <div class="ticker-item"><span class="dot dot-done"></span>done <b id="stat-done">0</b></div>
      <div class="ticker-item ticker-total">total <b id="stat-total">0</b></div>
    </div>
  </header>

  <main class="layout">
    <section class="composer" aria-label="Add task">
      <form id="task-form">
        <input id="title" name="title" type="text" placeholder="Add a task…" maxlength="200" required />
        <input id="description" name="description" type="text" placeholder="Details (optional)" maxlength="2000" />
        <select id="priority" name="priority">
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
        </select>
        <button type="submit">Add task</button>
      </form>
    </section>

    <section class="board" id="board">
      <div class="column" data-status="backlog">
        <h2>Backlog <span class="count" id="count-backlog">0</span></h2>
        <div class="dropzone" data-status="backlog" id="col-backlog"></div>
      </div>
      <div class="column" data-status="in_progress">
        <h2>In progress <span class="count" id="count-in_progress">0</span></h2>
        <div class="dropzone" data-status="in_progress" id="col-in_progress"></div>
      </div>
      <div class="column" data-status="done">
        <h2>Done <span class="count" id="count-done">0</span></h2>
        <div class="dropzone" data-status="done" id="col-done"></div>
      </div>
    </section>

    <section class="console" aria-label="Activity log">
      <div class="console-head">
        <span class="console-dot"></span>
        <span>activity.log</span>
      </div>
      <div class="console-body" id="log"></div>
    </section>
  </main>

  <script src="static/app.js"></script>
</body>
</html>
